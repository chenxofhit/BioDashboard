banner:
  location: config/banner.txt
  encoding: utf-8
server:
  servlet:
    context-path: /biodashboard
    session:
      timeout: 30m
  tomcat:
    threads:
      max: 1000
      min-spare: 30
  port: 8088
spring:
  thymeleaf:
    mode: HTML
    cache: false
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB
  devtools:
    restart:
      enabled: true
  #freemarker配置
  freemarker:
    content-type: text/html
    #后缀名
    suffix: .html
    template-loader-path: classpath:/templates/ftl
    charset: UTF-8
    check-template-location: true
  # Flyway 数据库迁移配置
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: true
   
mybatis-plus:
  mapper-locations: classpath:/mapper/**/*Mapper.xml
  typeAliasesPackage: com.bio.**.domain
  global-config:
    id-type: 0
    field-strategy: 2
    db-column-underline: true
    capital-mode: true
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
 
#设置一个邮件发送人
biodashboard:
  mail:
    sender: chenxofhit@qq.com